[package]
name = "aux-dsp-comp-clean"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

# Skip wasm-opt — same reason as dsp-eq8: bundled wasm-opt rejects rustc's
# bulk-memory ops. Release profile (LTO + opt-level=3 at workspace root)
# produces a small + fast binary on its own.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
