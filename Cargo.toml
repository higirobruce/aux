[workspace]
resolver = "2"
members = [
  "packages/dsp-eq8",
  "packages/dsp-comp-clean",
  "packages/dsp-comp-color",
  "packages/dsp-limiter",
  "packages/dsp-plate",
  "packages/dsp-hall",
  "packages/dsp-transient",
  "packages/dsp-deess",
  "packages/dsp-imager",
  "packages/dsp-tape",
]

# Optimize WASM size + perf for release builds.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
